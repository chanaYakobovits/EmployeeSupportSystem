<mat-toolbar class="header">
  @if (showMenuButton()) {
    <button mat-icon-button type="button" aria-label="פתיחת תפריט" (click)="menuToggle.emit()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a class="brand" routerLink="/">עובדנט</a>
  <span class="spacer"></span>
  <!-- Basic sign-out; user name, role and menu come in task 2.2 part B. -->
  <button mat-button type="button" class="logout" (click)="logout()">
    <mat-icon aria-hidden="true" class="icon-mirror-rtl">logout</mat-icon>
    יציאה
  </button>
</mat-toolbar>
