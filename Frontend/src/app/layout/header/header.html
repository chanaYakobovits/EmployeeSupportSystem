<header class="header">
  <div class="start">
    @if (compact()) {
      <button mat-icon-button type="button" class="menu-button" aria-label="פתיחת התפריט הראשי" (click)="menuToggle.emit()">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
    } @else {
      <a class="brand" routerLink="/" aria-label="עובדנט – דף הבית">
        <img class="brand-icon" src="logo-icon.svg" alt="" width="44" height="44" />
        <span class="brand-text">
          <span class="brand-name">עובדנט</span>
          <span class="brand-slogan">הופכים פניות לפתרונות</span>
        </span>
      </a>
    }
  </div>

  <button
    type="button"
    class="user-button"
    [matMenuTriggerFor]="userMenu"
    [attr.aria-label]="'תפריט משתמש: ' + fullName() + ', ' + roleText()"
  >
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    @if (!compact()) {
      <span class="user-info" aria-hidden="true">
        <span class="user-name">{{ fullName() }}</span>
        <span class="user-role">{{ roleText() }}</span>
      </span>
      <mat-icon class="chevron" aria-hidden="true">expand_more</mat-icon>
    }
  </button>

  <mat-menu #userMenu="matMenu" xPosition="after" class="user-menu-panel">
    <div class="menu-user" aria-hidden="true">
      <span class="user-name">{{ fullName() }}</span>
      <span class="user-role">{{ roleText() }}</span>
    </div>
    <button mat-menu-item type="button" (click)="openChangePassword()">
      <mat-icon aria-hidden="true">lock_reset</mat-icon>
      <span>החלפת סיסמה</span>
    </button>
    <button mat-menu-item type="button" (click)="logout()">
      <mat-icon aria-hidden="true" class="icon-mirror-rtl">logout</mat-icon>
      <span>יציאה</span>
    </button>
  </mat-menu>
</header>
